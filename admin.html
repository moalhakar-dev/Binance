<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المشرف • Binance Invest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'Cairo',sans-serif;
            background:#111;
            color:#fff;
            padding:20px;
            min-height:100vh;
        }
        .container{ max-width:900px; margin:auto; }
        h1{ color:gold; text-align:center; margin-bottom:10px; }
        .admin-badge { text-align: center; color: #00ff9d; font-size: 13px; margin-bottom: 20px; }
        .debug-box {
            background: #222;
            border: 1px dashed gold;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 13px;
            word-break: break-all;
        }
        .debug-box .label { color: #888; margin-bottom: 5px; display: block; }
        .debug-box .value { color: gold; font-weight: 700; font-family: monospace; }
        .debug-box .match { color: #00ff9d; }
        .debug-box .no-match { color: #ff6b6b; }
        .tabs{ display:flex; gap:10px; margin-bottom:20px; justify-content:center; flex-wrap: wrap; }
        .tab-btn{
            padding:10px 20px; background:#333; border:none; border-radius:30px;
            cursor:pointer; font-weight:bold; color:gold; font-family:'Cairo',sans-serif; transition:0.3s;
        }
        .tab-btn.active{ background:gold; color:black; }
        .tab-btn:hover{ background:#444; }
        .tab-btn.active:hover{ background:gold; }
        .tab-content{ display:none; }
        .tab-content.active{ display:block; }
        .request-card{
            background:#1a1a1a; border:2px solid gold; border-radius:10px; padding:15px;
            margin-bottom:15px; word-break: break-word; overflow-wrap: break-word;
            animation: fadeInCard 0.3s ease;
        }
        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .request-header{
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:10px; flex-wrap: wrap; gap: 10px;
        }
        .user-info{ color:#00ff9d; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .plan-tag {
            background: linear-gradient(135deg, rgba(243,186,47,0.25), rgba(243,186,47,0.1));
            border: 1px solid rgba(243,186,47,0.5); color: gold;
            padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700;
        }
        .copy-icon{
            cursor:pointer; color:gold; font-size:14px; transition:0.2s;
            background: rgba(255,215,0,0.2); padding:4px 8px; border-radius:5px;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .copy-icon:hover{ background: gold; color: black; }
        .amount{ font-size:20px; color:gold; font-weight:bold; white-space: nowrap; }
        .details{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:10px 0; color:#ccc; }
        .detail-item{
            display: flex; align-items: center; gap: 5px;
            background: rgba(255,255,255,0.05); padding: 5px 8px;
            border-radius: 5px; word-break: break-word; font-size: 13px;
        }
        .detail-item span{ flex:1; }
        .actions{ display:flex; gap:10px; margin-top:10px; flex-wrap: wrap; }
        .approve-btn{
            flex:1; padding:10px; background:#00cc66; border:none; border-radius:5px;
            color:white; font-weight:bold; cursor:pointer; font-family: inherit;
            transition: 0.2s; min-width: 120px;
        }
        .reject-btn{
            flex:1; padding:10px; background:#ff3333; border:none; border-radius:5px;
            color:white; font-weight:bold; cursor:pointer; font-family: inherit;
            transition: 0.2s; min-width: 120px;
        }
        .approve-btn:hover{ background:#00aa55; }
        .reject-btn:hover{ background:#dd2222; }
        .approve-btn:disabled, .reject-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .loader{ text-align:center; padding:20px; color:#888; }
        .copy-card-btn{
            background: #333; border: 1px solid gold; color: gold; padding: 8px;
            border-radius: 5px; cursor: pointer; font-size: 13px;
            display: flex; align-items: center; justify-content: center; gap: 5px;
            margin-top: 10px; width: 100%; font-family: inherit; transition: 0.2s;
        }
        .copy-card-btn:hover{ background: gold; color: black; }
        .type-badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
        .type-badge.wallet { background: rgba(59,130,246,0.15); color: #93c5fd; }
        .type-badge.crypto { background: rgba(168,85,247,0.15); color: #d8b4fe; }
        .empty-msg { text-align: center; padding: 40px 20px; color: #888; font-size: 16px; }
        .error-msg { text-align: center; padding: 20px; color: #fca5a5; }
        .spinner {
            border: 3px solid #333; border-top: 3px solid gold; border-radius: 50%;
            width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .access-denied {
            max-width: 600px; margin: 40px auto; padding: 30px;
            background: #1a1a1a; border: 2px solid #ff3333; border-radius: 15px;
            text-align: center;
        }
        .access-denied h2 { color: #fca5a5; margin-bottom: 20px; font-size: 22px; }
        .access-denied p { color: #ccc; margin-bottom: 15px; line-height: 1.8; }
        .access-denied .uid-box {
            background: #000; padding: 15px; border-radius: 8px;
            margin: 20px 0; font-family: monospace; font-size: 14px;
            color: gold; word-break: break-all; border: 1px solid #333;
        }
        .access-denied .btn {
            display: inline-block; padding: 12px 30px; background: gold; color: #111;
            text-decoration: none; border-radius: 30px; font-weight: 700;
            margin: 5px; border: none; cursor: pointer; font-family: inherit; font-size: 14px;
        }
        .access-denied .btn:hover { background: #fcd970; }
        .access-denied .btn-outline {
            background: transparent; color: gold; border: 2px solid gold;
        }
        .access-denied .btn-outline:hover { background: rgba(243,186,47,0.1); }

        .receipt-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 15px;
            animation: fadeInModal 0.3s ease;
        }
        .receipt-modal.show { display: flex; }
        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .receipt-modal-content {
            background: #1a1a1a;
            border: 2px solid gold;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(243, 186, 47, 0.3);
        }
        .receipt-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(243, 186, 47, 0.3);
            background: rgba(0, 0, 0, 0.3);
        }
        .receipt-modal-header h3 {
            color: gold;
            font-size: 18px;
            font-weight: 800;
            margin: 0;
        }
        .receipt-close-btn {
            background: rgba(255, 51, 51, 0.15);
            color: #fca5a5;
            border: 1px solid #ff3333;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
            font-family: inherit;
        }
        .receipt-close-btn:hover {
            background: #ff3333;
            color: white;
        }
        .receipt-modal-body {
            padding: 20px;
            overflow: auto;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
        }
        .receipt-modal-body img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 10px;
            border: 1px solid gold;
        }
        .receipt-loading {
            text-align: center;
            color: #888;
        }
        .receipt-error {
            text-align: center;
            color: #fca5a5;
            padding: 30px 20px;
        }
        .receipt-error .icon {
            font-size: 50px;
            display: block;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .details { grid-template-columns: 1fr; }
            .detail-item[style*="grid-column"] { grid-column: span 1 !important; }
            .request-header { flex-direction: column; align-items: flex-start; }
            .amount { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <h1>👑 لوحة تحكم المشرف</h1>
        <p class="admin-badge">مرحباً بك، يمكنك مراجعة الطلبات المعلقة والموافقة عليها</p>

        <div class="tabs">
            <button class="tab-btn active" id="tabDepositsBtn" onclick="switchTab('deposits')">💰 طلبات الإيداع</button>
            <button class="tab-btn" id="tabWithdrawalsBtn" onclick="switchTab('withdrawals')">💸 طلبات السحب</button>
        </div>

        <div id="depositsSection" class="tab-content active">
            <div id="depositsList">
                <div class="spinner"></div>
                <p class="loader">جاري تحميل طلبات الإيداع...</p>
            </div>
        </div>

        <div id="withdrawalsSection" class="tab-content">
            <div id="withdrawalsList">
                <div class="spinner"></div>
                <p class="loader">جاري تحميل طلبات السحب...</p>
            </div>
        </div>
    </div>

    <!-- Modal عرض الإيصال -->
    <div class="receipt-modal" id="receiptModal">
        <div class="receipt-modal-content">
            <div class="receipt-modal-header">
                <h3>📎 إيصال التحويل</h3>
                <button class="receipt-close-btn" onclick="closeReceiptModal()">✕</button>
            </div>
            <div class="receipt-modal-body" id="receiptModalBody">
                <div class="receipt-loading">
                    <div class="spinner"></div>
                    <p>⏳ جاري تحميل الإيصال...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== تهيئة Firebase ==========
        firebase.initializeApp({
            apiKey: "AIzaSyB78JT_cbPMizvzKWBrQoQUe3-zukHrr1U",
            authDomain: "pharacoin.firebaseapp.com",
            projectId: "pharacoin",
            storageBucket: "pharacoin.firebasestorage.app",
            messagingSenderId: "1047668783635",
            appId: "1:1047668783635:web:10673630ede69c60181de6",
            measurementId: "G-06CG470MPX"
        });

        const auth = firebase.auth();
        const db = firebase.firestore();

        // ========== قائمة UIDs الأدمن ==========
        const ADMIN_UIDS = ["uJ9gFnxGnVSeyBJSKoyGlkPfJBE2"];

        // بوت التليجرام
        const TELEGRAM_BOT_TOKEN = "8535863939:AAFC4qgREiGQC-4c1QCQNrNp3gMprRsQRTs";

        // 🎯 القيم الموحدة للحالات
        const STATUS = {
            PENDING: 'pending',      // قيد المراجعة
            COMPLETED: 'completed',  // مكتمل ✅ (الموحدة)
            REJECTED: 'rejected'     // مرفوض
        };

        // بيانات الخطط
        const planData = {
            starter: { name: 'الباقة المبتدئة', amount: 10, dailyProfit: 5, durationDays: 10 },
            bronze:  { name: 'الباقة البرونزية', amount: 30, dailyProfit: 15, durationDays: 10 },
            silver:  { name: 'الباقة الفضية', amount: 100, dailyProfit: 50, durationDays: 10 },
            gold:    { name: 'الباقة الذهبية', amount: 500, dailyProfit: 250, durationDays: 10 },
            diamond: { name: 'الباقة الماسية', amount: 1000, dailyProfit: 500, durationDays: 10 }
        };

        let currentUser = null;
        let unsubscribeDeposits = null;
        let unsubscribeWithdrawals = null;

        // ========== مراقبة تسجيل الدخول ==========
        auth.onAuthStateChanged(user => {
            if (!user) {
                showAccessDenied(null, 'غير مسجل دخول');
                return;
            }

            currentUser = user;
            const isAdmin = ADMIN_UIDS.includes(user.uid);

            console.log('🔍 معلومات التسجيل:');
            console.log('📧 البريد:', user.email);
            console.log('🆔 UID الحالي:', user.uid);
            console.log('✅ هل أنا أدمن؟', isAdmin);

            if (!isAdmin) {
                showAccessDenied(user, 'ليس لديك صلاحية');
                return;
            }

            listenToDeposits();
            listenToWithdrawals();
        });

        // ========== صفحة رفض الوصول ==========
        function showAccessDenied(user, reason) {
            const container = document.getElementById('mainContainer');
            
            let uidDisplay = '';
            if (user) {
                uidDisplay = `
                    <div class="debug-box" style="text-align:right; margin-top:20px;">
                        <span class="label">📧 البريد الإلكتروني:</span>
                        <span class="value">${user.email || 'غير معروف'}</span>
                        <br><br>
                        <span class="label">🆔 UID الحساب الحالي:</span>
                        <span class="value no-match">${user.uid}</span>
                        <br><br>
                        <span class="label">🔑 UID المطلوب للأدمن:</span>
                        <span class="value match">${ADMIN_UIDS[0]}</span>
                        <br><br>
                        <span class="label">📊 نتيجة المقارنة:</span>
                        <span class="value no-match">❌ غير متطابقين</span>
                    </div>
                    <p style="color:#fca5a5; margin-top:20px;">
                        ⚠️ أنت مسجّل دخول بحساب مختلف عن حساب الأدمن
                    </p>
                `;
            } else {
                uidDisplay = `
                    <p style="color:#fca5a5;">
                        ⚠️ يجب تسجيل الدخول أولاً بحساب الأدمن
                    </p>
                `;
            }

            container.innerHTML = `
                <div class="access-denied">
                    <h2>⛔ ليس لديك صلاحية الدخول</h2>
                    <p>${reason}</p>
                    ${uidDisplay}
                    
                    <div style="margin-top:30px;">
                        <a href="signup.html" class="btn">🔑 تسجيل دخول الأدمن</a>
                        <button class="btn btn-outline" onclick="logoutAndRedirect()">🚪 تسجيل خروج</button>
                    </div>

                    <div style="margin-top:25px; padding-top:20px; border-top:1px solid #333; color:#666; font-size:12px;">
                        💡 <strong>حل المشكلة:</strong><br>
                        سجّل خروج من الحساب الحالي، ثم سجّل دخول بحساب الأدمن<br>
                        (البريد الإلكتروني: <span style="color:gold;">${user ? user.email : 'حساب الأدمن'}</span>)
                    </div>
                </div>
            `;
        }

        // ========== تسجيل خروج ==========
        function logoutAndRedirect() {
            auth.signOut().then(() => {
                window.location.href = 'signup.html';
            }).catch(err => {
                alert('خطأ: ' + err.message);
            });
        }

        // ========== التبويبات ==========
        function switchTab(tab) {
            document.getElementById('tabDepositsBtn').classList.remove('active');
            document.getElementById('tabWithdrawalsBtn').classList.remove('active');
            document.getElementById('depositsSection').classList.remove('active');
            document.getElementById('withdrawalsSection').classList.remove('active');
            if (tab === 'deposits') {
                document.getElementById('tabDepositsBtn').classList.add('active');
                document.getElementById('depositsSection').classList.add('active');
            } else {
                document.getElementById('tabWithdrawalsBtn').classList.add('active');
                document.getElementById('withdrawalsSection').classList.add('active');
            }
        }

        // ========== دوال مساعدة ==========
        function copyText(text) {
            if (!text) text = '';
            navigator.clipboard.writeText(text).then(() => {
                showToast('✅ تم النسخ: ' + text.substring(0, 30));
            }).catch(() => {
                showToast('❌ فشل النسخ');
            });
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(20,30,60,0.95);border:1px solid gold;color:gold;padding:12px 24px;border-radius:30px;font-weight:700;z-index:9999;font-family:Cairo,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,0.5);';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'غير معروف';
            try {
                if (timestamp.seconds) return new Date(timestamp.seconds * 1000).toLocaleString('ar-EG');
                if (timestamp.toDate) return timestamp.toDate().toLocaleString('ar-EG');
                return new Date(timestamp).toLocaleString('ar-EG');
            } catch (e) {
                return 'غير معروف';
            }
        }

        function getPlanName(planKey, planName) {
            return planName || (planData[planKey]?.name) || planKey || 'بدون خطة';
        }

        function copyCard(data, type) {
            let text = '';
            if (type === 'deposit') {
                text = `📥 طلب إيداع\n👤 المستخدم: ${data.userName}\n💰 المبلغ: $${data.amount}\n🎯 الباقة: ${data.plan}\n💳 الطريقة: ${data.method}\n📱 المُرسل: ${data.sender}\n📅 التاريخ: ${data.date}`;
            } else {
                text = `📤 طلب سحب\n👤 المستخدم: ${data.userName}\n💰 المبلغ: $${data.amount}\n🎯 الباقة: ${data.plan}\n💳 الطريقة: ${data.method}\n📍 الوجهة: ${data.address}\n📅 التاريخ: ${data.date}`;
            }
            copyText(text);
        }

        // ========== الإيداعات ==========
        function listenToDeposits() {
            if (unsubscribeDeposits) unsubscribeDeposits();
            unsubscribeDeposits = db.collection("deposits")
                .where("status", "==", STATUS.PENDING)
                .onSnapshot(snapshot => {
                    renderDeposits(snapshot);
                }, err => {
                    console.error(err);
                    document.getElementById('depositsList').innerHTML =
                        `<p class="error-msg">❌ خطأ في تحميل الإيداعات: ${err.message}</p>`;
                });
        }

        function renderDeposits(snapshot) {
            const listEl = document.getElementById('depositsList');
            if (snapshot.empty) {
                listEl.innerHTML = '<p class="empty-msg">✅ لا توجد طلبات إيداع معلقة</p>';
                return;
            }

            const docs = [];
            snapshot.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
            docs.sort((a, b) => {
                const ta = a.createdAt?.seconds || 0;
                const tb = b.createdAt?.seconds || 0;
                return tb - ta;
            });

            let html = '';
            docs.forEach(data => {
                const date = formatDate(data.createdAt);
                const amount = data.amount || 0;
                const isCrypto = data.type === 'crypto';
                const userName = data.userName || data.username || 'مستخدم';
                const planName = getPlanName(data.planKey, data.planName);
                
                const typeBadge = isCrypto
                    ? `<span class="type-badge crypto">🪙 محفظة رقمية</span>`
                    : `<span class="type-badge wallet">📱 محفظة إلكترونية</span>`;

                const senderInfo = isCrypto
                    ? `الشبكة: ${(data.network || '').toUpperCase()} • العنوان: ${data.senderAddress || 'غير محدد'}`
                    : `الرقم المُرسل: ${data.senderPhone || 'غير محدد'} • المستقبل: ${data.phoneNumber || '01213959111'}`;

                const receiptBtn = data.receiptFileId
                    ? `<button class="copy-card-btn" onclick="viewReceipt('${data.receiptFileId}')" style="background: rgba(59,130,246,0.15); color: #93c5fd; border-color: rgba(59,130,246,0.5);">📎 عرض الإيصال</button>`
                    : '';

                html += `
                    <div class="request-card" id="deposit-${data.id}">
                        <div class="request-header">
                            <div class="user-info">
                                <span>👤 ${userName}</span>
                                <span class="copy-icon" onclick="copyText('${userName.replace(/'/g, "\\'")}')">
                                    <i class="fas fa-copy"></i> نسخ
                                </span>
                            </div>
                            <span class="amount">💰 $${amount}</span>
                        </div>
                        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
                            ${typeBadge}
                            <span class="plan-tag">🎯 ${planName}</span>
                        </div>
                        <div class="details">
                            <div class="detail-item" style="grid-column: span 3;">
                                <i class="fas fa-info-circle" style="color:gold;"></i>
                                <span>${senderInfo}</span>
                            </div>
                            <div class="detail-item">
                                <i class="fas fa-calendar" style="color:gold;"></i>
                                <span>${date}</span>
                            </div>
                            <div class="detail-item" style="grid-column: span 2;">
                                <i class="fas fa-id-card" style="color:gold;"></i>
                                <span>${data.userId}</span>
                                <span class="copy-icon" onclick="copyText('${data.userId || ''}')">
                                    <i class="fas fa-copy"></i>
                                </span>
                            </div>
                        </div>
                        ${receiptBtn}
                        <div class="actions">
                            <button class="approve-btn" onclick="approveDeposit('${data.id}', '${data.userId}', ${amount})">✅ الموافقة</button>
                            <button class="reject-btn" onclick="rejectDeposit('${data.id}', '${data.userId}')">❌ الرفض</button>
                        </div>
                        <button class="copy-card-btn" onclick="copyCard({userName:'${userName.replace(/'/g, "\\'")}', amount:${amount}, plan:'${planName}', method:'${isCrypto ? 'محفظة رقمية' : 'محفظة إلكترونية'}', sender:'${senderInfo.replace(/'/g, "\\'")}', date:'${date}'}, 'deposit')">
                            <i class="fas fa-copy"></i> نسخ البطاقة بالكامل
                        </button>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        // ========== ✅ الموافقة على الإيداع (مع التحقق) ==========
        async function approveDeposit(docId, userId, amount) {
            if (!confirm('هل أنت متأكد من الموافقة على هذا الإيداع؟\nسيتم تفعيل الخطة للمستخدم.')) return;
            
            const amountNumber = Number(amount);
            if (isNaN(amountNumber) || amountNumber <= 0) {
                alert('❌ المبلغ غير صالح');
                return;
            }

            // تعطيل الزر
            const btn = event?.target;
            if (btn) { btn.disabled = true; btn.textContent = '⏳ جاري...'; }

            try {
                console.log('🔄 جاري الموافقة على الإيداع:', docId);

                // ✅ 1. تحديث الإيداع بحالة "completed" (الموحدة)
                await db.collection("deposits").doc(docId).update({
                    status: STATUS.COMPLETED,
                    approvedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    approvedBy: currentUser?.uid || 'admin'
                });

                console.log('✅ تم تحديث الإيداع');

                // ✅ 2. التحقق من نجاح التحديث
                const checkDoc = await db.collection("deposits").doc(docId).get();
                const newStatus = checkDoc.data()?.status;
                console.log('📊 الحالة الجديدة:', newStatus);

                if (newStatus !== STATUS.COMPLETED) {
                    throw new Error('فشل تحديث حالة الإيداع! الحالة الحالية: ' + newStatus);
                }

                // ✅ 3. تفعيل الاستثمار للمستخدم
                const userRef = db.collection("users").doc(userId);
                const userDoc = await userRef.get();
                
                if (userDoc.exists) {
                    const userData = userDoc.data();
                    let investments = userData.investments || [];
                    let found = false;
                    const now = new Date();

                    investments = investments.map(inv => {
                        if (!found && inv.status === 'pending') {
                            const matchesAmount = Math.abs((parseFloat(inv.amount) || 0) - amountNumber) < 1;
                            if (matchesAmount) {
                                found = true;
                                console.log('✅ تم العثور على الاستثمار المعلق، تفعيله...');
                                return {
                                    ...inv,
                                    status: 'active',
                                    startDate: now.toISOString(),
                                    endDate: new Date(now.getTime() + (inv.durationDays || 10) * 24 * 60 * 60 * 1000).toISOString(),
                                    lastSnapshotDate: now.toISOString(),
                                    approvedAt: now.toISOString(),
                                    accumulatedProfit: 0
                                };
                            }
                        }
                        return inv;
                    });

                    await userRef.update({ investments });
                    console.log('✅ تم تحديث بيانات المستخدم');
                } else {
                    console.warn('⚠️ المستخدم غير موجود:', userId);
                }

                showToast('✅ تمت الموافقة على الإيداع وتفعيل الخطة');
                
                // إخفاء البطاقة بعد النجاح
                const card = document.getElementById(`deposit-${docId}`);
                if (card) {
                    card.style.transition = 'opacity 0.3s, transform 0.3s';
                    card.style.opacity = '0';
                    card.style.transform = 'scale(0.9)';
                    setTimeout(() => card.remove(), 300);
                }

            } catch (err) {
                console.error('❌ خطأ في القبول:', err);
                alert('❌ فشل القبول: ' + err.message + '\n\nتأكد من:\n1. تسجيل دخول بحساب الأدمن\n2. قواعد Firestore محدّثة');
                if (btn) { btn.disabled = false; btn.textContent = '✅ الموافقة'; }
            }
        }

        // ========== ❌ رفض الإيداع ==========
        async function rejectDeposit(docId, userId) {
            if (!confirm('هل أنت متأكد من رفض هذا الإيداع؟')) return;

            const btn = event?.target;
            if (btn) { btn.disabled = true; btn.textContent = '⏳ جاري...'; }

            try {
                console.log('🔄 جاري رفض الإيداع:', docId);

                await db.collection("deposits").doc(docId).update({
                    status: STATUS.REJECTED,
                    rejectedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    rejectedBy: currentUser?.uid || 'admin'
                });

                // تحديث حالة الاستثمار المرتبط إلى rejected
                if (userId) {
                    const userRef = db.collection("users").doc(userId);
                    const userDoc = await userRef.get();
                    if (userDoc.exists) {
                        const userData = userDoc.data();
                        let investments = userData.investments || [];
                        investments = investments.map(inv => {
                            if (inv.status === 'pending') {
                                return { ...inv, status: 'rejected', rejectedAt: new Date().toISOString() };
                            }
                            return inv;
                        });
                        await userRef.update({ investments });
                    }
                }

                showToast('❌ تم رفض الإيداع');

                const card = document.getElementById(`deposit-${docId}`);
                if (card) {
                    card.style.transition = 'opacity 0.3s, transform 0.3s';
                    card.style.opacity = '0';
                    card.style.transform = 'scale(0.9)';
                    setTimeout(() => card.remove(), 300);
                }
            } catch (err) {
                console.error('❌ خطأ في الرفض:', err);
                alert('❌ فشل الرفض: ' + err.message);
                if (btn) { btn.disabled = false; btn.textContent = '❌ الرفض'; }
            }
        }

        // ========== السحوبات ==========
        function listenToWithdrawals() {
            if (unsubscribeWithdrawals) unsubscribeWithdrawals();
            unsubscribeWithdrawals = db.collection("withdrawals")
                .where("status", "==", STATUS.PENDING)
                .onSnapshot(snapshot => {
                    renderWithdrawals(snapshot);
                }, err => {
                    console.error(err);
                    document.getElementById('withdrawalsList').innerHTML =
                        `<p class="error-msg">❌ خطأ في تحميل السحوبات: ${err.message}</p>`;
                });
        }

        function renderWithdrawals(snapshot) {
            const listEl = document.getElementById('withdrawalsList');
            if (snapshot.empty) {
                listEl.innerHTML = '<p class="empty-msg">✅ لا توجد طلبات سحب معلقة</p>';
                return;
            }

            const docs = [];
            snapshot.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
            docs.sort((a, b) => {
                const ta = a.createdAt?.seconds || 0;
                const tb = b.createdAt?.seconds || 0;
                return tb - ta;
            });

            let html = '';
            docs.forEach(data => {
                const date = formatDate(data.createdAt);
                const amount = data.amount || 0;
                const isCrypto = data.method === 'crypto';
                const userName = data.userName || data.username || 'مستخدم';
                const planName = getPlanName(data.planKey, data.planName);

                const typeBadge = isCrypto
                    ? `<span class="type-badge crypto">🪙 محفظة رقمية</span>`
                    : `<span class="type-badge wallet">📱 محفظة إلكترونية</span>`;

                const destination = isCrypto
                    ? `العملة: ${data.currency || 'غير محدد'} • العنوان: ${data.address || 'غير محدد'}`
                    : `${data.ewalletName || 'محفظة إلكترونية'} • الرقم: ${data.phone || 'غير محدد'}`;

                html += `
                    <div class="request-card" id="withdraw-${data.id}">
                        <div class="request-header">
                            <div class="user-info">
                                <span>👤 ${userName}</span>
                                <span class="copy-icon" onclick="copyText('${userName.replace(/'/g, "\\'")}')">
                                    <i class="fas fa-copy"></i> نسخ
                                </span>
                            </div>
                            <span class="amount">💸 $${amount}</span>
                        </div>
                        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
                            ${typeBadge}
                            <span class="plan-tag">🎯 ${planName}</span>
                        </div>
                        <div class="details">
                            <div class="detail-item" style="grid-column: span 3;">
                                <i class="fas fa-map-marker-alt" style="color:gold;"></i>
                                <span>${destination}</span>
                            </div>
                            <div class="detail-item">
                                <i class="fas fa-calendar" style="color:gold;"></i>
                                <span>${date}</span>
                            </div>
                            <div class="detail-item" style="grid-column: span 2;">
                                <i class="fas fa-id-card" style="color:gold;"></i>
                                <span>${data.userId}</span>
                                <span class="copy-icon" onclick="copyText('${data.userId || ''}')">
                                    <i class="fas fa-copy"></i>
                                </span>
                            </div>
                        </div>
                        <div class="actions">
                            <button class="approve-btn" onclick="approveWithdraw('${data.id}')">✅ الموافقة</button>
                            <button class="reject-btn" onclick="rejectWithdraw('${data.id}', '${data.userId}', ${amount})">❌ الرفض</button>
                        </div>
                        <button class="copy-card-btn" onclick="copyCard({userName:'${userName.replace(/'/g, "\\'")}', amount:${amount}, plan:'${planName}', method:'${isCrypto ? 'محفظة رقمية' : 'محفظة إلكترونية'}', address:'${destination.replace(/'/g, "\\'")}', date:'${date}'}, 'withdraw')">
                            <i class="fas fa-copy"></i> نسخ البطاقة بالكامل
                        </button>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        // ========== ✅ الموافقة على السحب ==========
        async function approveWithdraw(docId) {
            if (!confirm('هل أنت متأكد من الموافقة على هذا السحب؟\n⚠️ تأكد من تحويل المبلغ للمستخدم أولاً.')) return;

            const btn = event?.target;
            if (btn) { btn.disabled = true; btn.textContent = '⏳ جاري...'; }

            try {
                await db.collection("withdrawals").doc(docId).update({
                    status: STATUS.COMPLETED,
                    approvedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    approvedBy: currentUser?.uid || 'admin'
                });

                showToast('✅ تمت الموافقة على السحب');

                const card = document.getElementById(`withdraw-${docId}`);
                if (card) {
                    card.style.transition = 'opacity 0.3s';
                    card.style.opacity = '0';
                    setTimeout(() => card.remove(), 300);
                }
            } catch (err) {
                console.error('❌ خطأ:', err);
                alert('❌ فشل: ' + err.message);
                if (btn) { btn.disabled = false; btn.textContent = '✅ الموافقة'; }
            }
        }

        // ========== ❌ رفض السحب (مع إعادة الرصيد) ==========
        async function rejectWithdraw(docId, userId, amount) {
            if (!confirm('هل أنت متأكد من رفض هذا السحب؟\nسيتم إعادة المبلغ لرصيد المستخدم.')) return;

            const btn = event?.target;
            if (btn) { btn.disabled = true; btn.textContent = '⏳ جاري...'; }

            try {
                await db.collection("withdrawals").doc(docId).update({
                    status: STATUS.REJECTED,
                    rejectedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    rejectedBy: currentUser?.uid || 'admin'
                });

                // ✅ إعادة المبلغ لرصيد المستخدم
                if (userId && amount > 0) {
                    const userRef = db.collection("users").doc(userId);
                    await userRef.update({
                        balance: firebase.firestore.FieldValue.increment(Number(amount))
                    });
                    console.log('✅ تم إعادة المبلغ للمستخدم:', amount);
                }

                showToast('❌ تم رفض السحب وإعادة الرصيد');

                const card = document.getElementById(`withdraw-${docId}`);
                if (card) {
                    card.style.transition = 'opacity 0.3s';
                    card.style.opacity = '0';
                    setTimeout(() => card.remove(), 300);
                }
            } catch (err) {
                console.error('❌ خطأ:', err);
                alert('❌ فشل: ' + err.message);
                if (btn) { btn.disabled = false; btn.textContent = '❌ الرفض'; }
            }
        }

        // ========== عرض الإيصال في Modal ==========
        async function viewReceipt(fileId) {
            if (!fileId) {
                alert('❌ لا يوجد إيصال لهذا الطلب');
                return;
            }

            const modal = document.getElementById('receiptModal');
            const body = document.getElementById('receiptModalBody');

            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
            body.innerHTML = `
                <div class="receipt-loading">
                    <div class="spinner"></div>
                    <p>⏳ جاري تحميل الإيصال...</p>
                </div>
            `;

            try {
                const apiUrl = 'https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + 
                              '/getFile?file_id=' + encodeURIComponent(fileId);
                const res = await fetch(apiUrl);
                const data = await res.json();

                if (data.ok && data.result && data.result.file_path) {
                    const imageUrl = 'https://api.telegram.org/file/bot' + TELEGRAM_BOT_TOKEN + 
                                   '/' + data.result.file_path;
                    
                    body.innerHTML = `
                        <img src="${imageUrl}" alt="إيصال التحويل" 
                             onerror="this.parentElement.innerHTML='<div class=&quot;receipt-error&quot;><span class=&quot;icon&quot;>❌</span>تعذر تحميل الصورة</div>'" />
                    `;
                } else {
                    body.innerHTML = `
                        <div class="receipt-error">
                            <span class="icon">❌</span>
                            <p>تعذر تحميل الإيصال</p>
                            <p style="font-size:12px;color:#666;margin-top:10px;">
                                ${data.description || 'الملف غير متوفر'}
                            </p>
                        </div>
                    `;
                }
            } catch (err) {
                console.error('خطأ:', err);
                body.innerHTML = `
                    <div class="receipt-error">
                        <span class="icon">❌</span>
                        <p>فشل الاتصال بالخادم</p>
                        <p style="font-size:12px;color:#666;margin-top:10px;">
                            ${err.message}
                        </p>
                    </div>
                `;
            }
        }

        function closeReceiptModal() {
            const modal = document.getElementById('receiptModal');
            modal.classList.remove('show');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeReceiptModal();
        });

        document.getElementById('receiptModal').addEventListener('click', function(e) {
            if (e.target === this) closeReceiptModal();
        });
    </script>
</body>
</html>
