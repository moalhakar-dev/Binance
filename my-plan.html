<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>خطتي • Binance Invest</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-deep: #070b1a;
            --card-bg: rgba(20, 30, 60, 0.15);
            --gold: #f3ba2f;
            --gold-light: #fcd970;
            --gold-dark: #b8871e;
            --text: #ffffff;
            --text-dim: #e8ecf5;
            --text-muted: #9298b8;
            --border-light: rgba(255, 255, 255, 0.08);
            --sidebar-width: 260px;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --transition: 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            --gap: 20px;
            --padding-section: 24px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { overflow-x: hidden; width: 100%; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text);
            line-height: 1.6;
            direction: rtl;
            display: flex;
            min-height: 100vh;
            overflow-x: auto;
            overflow-y: auto;
            position: relative;
            width: 100%;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url('qs.png') center/cover no-repeat;
            z-index: -3;
            opacity: 1;
            filter: brightness(0.9) saturate(1.2);
            min-width: 100vw;
            min-height: 100vh;
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(243,186,47,0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(10,17,40,0.7) 0%, transparent 70%),
                linear-gradient(180deg, rgba(7,11,26,0.55) 0%, rgba(7,11,26,0.8) 100%);
            z-index: -2;
            backdrop-filter: blur(3px);
            min-width: 100vw;
            min-height: 100vh;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes glowPulse { 0%,100% { box-shadow: 0 0 20px rgba(243,186,47,0.3); } 50% { box-shadow: 0 0 45px rgba(243,186,47,0.7); } }
        @keyframes pulseIcon { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.15); opacity: 0.7; } }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; opacity: 0; visibility: hidden; transition: 0.3s; }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        .sidebar {
            width: var(--sidebar-width); min-width: var(--sidebar-width); flex-shrink: 0;
            background: rgba(10,17,40,0.75); backdrop-filter: blur(30px);
            border-left: 1px solid rgba(255,255,255,0.08); padding: 24px 16px;
            display: flex; flex-direction: column; position: fixed; top: 0; right: 0; bottom: 0;
            z-index: 50; transition: transform var(--transition); transform: translateX(0);
            overflow-y: auto; overflow-x: hidden;
        }
        .sidebar-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; padding: 0 8px; }
        .sidebar-logo .icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(243,186,47,0.15); border: 1px solid rgba(243,186,47,0.4); overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(243,186,47,0.3); flex-shrink: 0; }
        .sidebar-logo .icon img { width: 100%; height: 100%; object-fit: cover; }
        .sidebar-logo .text { font-weight: 900; font-size: 18px; color: var(--gold); text-shadow: 0 0 15px rgba(243,186,47,0.4); white-space: nowrap; }
        .nav-menu { list-style: none; flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; }
        .nav-menu li { margin-bottom: 6px; }
        .nav-menu a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; color: var(--text-dim); text-decoration: none; font-weight: 500; font-size: 14px; transition: all 0.2s; cursor: pointer; white-space: nowrap; }
        .nav-menu a:hover, .nav-menu a.active { background: rgba(243,186,47,0.15); color: var(--gold); box-shadow: 0 0 15px rgba(243,186,47,0.1); }
        .nav-menu a .emoji { font-size: 18px; flex-shrink: 0; }
        .sidebar-footer { margin-top: auto; padding: 16px 0 0; border-top: 1px solid rgba(255,255,255,0.08); font-size: 12px; color: var(--text-muted); text-align: center; white-space: nowrap; }
        .user-info { display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 12px; background: rgba(255,255,255,0.03); border-radius: 14px; }
        .user-avatar { width: 38px; height: 38px; min-width: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #0a0f1e; font-size: 16px; flex-shrink: 0; }
        .user-name { font-weight: 600; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .main-content {
            flex: 1; margin-right: var(--sidebar-width); padding: var(--padding-section);
            transition: margin var(--transition); display: flex; flex-direction: column; gap: var(--gap);
            overflow-x: auto; overflow-y: auto; min-width: 0; width: calc(100% - var(--sidebar-width));
        }
        .page-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
        .page-title-group { display: flex; align-items: center; gap: 14px; }
        .page-icon { width: 56px; height: 56px; border-radius: 16px; background: rgba(243,186,47,0.12); border: 1px solid rgba(243,186,47,0.3); display: flex; align-items: center; justify-content: center; font-size: 28px; animation: glowPulse 2.5s infinite; flex-shrink: 0; }
        .page-title h1 { font-size: clamp(20px, 4vw, 26px); font-weight: 900; }
        .page-title h1 .gold { color: var(--gold); }
        .page-title p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        .menu-toggle { display: none; background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; flex-shrink: 0; }
        .plans-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .plan-card {
            background: rgba(20,30,60,0.25); backdrop-filter: blur(15px);
            border: 1px solid rgba(243,186,47,0.2); border-radius: 20px; padding: 20px;
            display: flex; flex-direction: column; gap: 12px; transition: all 0.3s; position: relative; overflow: hidden;
        }
        .plan-card:hover { transform: translateY(-5px); border-color: rgba(243,186,47,0.5); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5); }
        .plan-card .plan-header { display: flex; justify-content: space-between; align-items: center; }
        .plan-card .plan-name { font-size: 18px; font-weight: 800; color: var(--gold); }
        .plan-card .plan-status { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; }
        .plan-card .plan-status.active { background: rgba(34,197,94,0.2); color: #4ade80; }
        .plan-card .plan-status.pending { background: rgba(243,186,47,0.2); color: var(--gold); }
        .plan-card .plan-status.completed { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .plan-card .plan-status.rejected { background: rgba(239,68,68,0.2); color: #fca5a5; }
        .plan-card .plan-status.inactive { background: rgba(148,163,184,0.15); color: #cbd5e1; }
        .plan-card .plan-details { display: flex; flex-direction: column; gap: 6px; }
        .plan-card .detail-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); }
        .plan-card .detail-row .val { font-weight: 700; color: var(--text); }
        .plan-card .progress-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; margin-top: 8px; }
        .plan-card .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dark), var(--gold)); border-radius: 10px; }
        .plan-card .btn-activate { padding: 10px 14px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; text-align: center; text-decoration: none; border: none; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #0a0f1e; transition: all 0.2s; display: block; }
        .plan-card .btn-activate:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(243,186,47,0.4); }
        .plan-card .btn-withdraw { padding: 10px 14px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; text-align: center; text-decoration: none; border: none; background: transparent; color: #4ade80; border: 1px solid rgba(74,222,128,0.5); transition: all 0.2s; display: block; }
        .plan-card .btn-withdraw:hover { background: rgba(74,222,128,0.1); }
        .plan-card .btn-completed {
            padding: 12px 14px; border-radius: 12px; font-weight: 700; font-size: 13px;
            text-align: center; border: 1px solid rgba(96,165,250,0.5);
            background: rgba(59,130,246,0.1); color: #60a5fa;
        }
        .pending-message {
            text-align: center; padding: 14px 12px; border-radius: 12px;
            background: rgba(243,186,47,0.1); border: 1px dashed rgba(243,186,47,0.4);
            color: var(--gold); font-weight: 600; font-size: 13px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .pending-message .pulse-dot {
            width: 10px; height: 10px; border-radius: 50%; background: var(--gold);
            animation: pulseIcon 1.5s infinite; flex-shrink: 0;
        }
        .completed-message {
            text-align: center; padding: 14px 12px; border-radius: 12px;
            background: rgba(59,130,246,0.1); border: 1px dashed rgba(96,165,250,0.4);
            color: #60a5fa; font-weight: 600; font-size: 13px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        /* ✅ رسالة الرفض */
        .rejected-message {
            text-align: center; padding: 14px 12px; border-radius: 12px;
            background: rgba(239,68,68,0.1); border: 1px dashed rgba(239,68,68,0.5);
            color: #fca5a5; font-weight: 600; font-size: 13px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(100%); width: 260px; min-width: 260px; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; padding: 14px; width: 100%; }
            .menu-toggle { display: block; }
            .page-icon { width: 44px; height: 44px; font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo"><div class="icon"><img src="qa.png" alt="Logo" /></div><span class="text">BINANCE</span></div>
        <div class="user-info">

            <div><div class="user-name" id="sidebarUserName">محمد أحمد</div><div style="font-size:10px;color:var(--text-muted)">مستثمر فضي</div></div>

    <main class="main-content">
        <div class="page-header">
            <div class="page-title-group">
                <div class="page-icon">🎯</div>
                <div class="page-title">
                    <h1><span class="gold">خطتك</span> الاستثمارية</h1>
                    <p>جميع الخطط المتاحة - اختر باقتك وابدأ الربح</p>
                </div>
            </div>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>

        <div class="plans-container" id="plansContainer"></div>
    </main>

    <script>
        // ========== تهيئة Firebase ==========
        const firebaseConfig = {
            apiKey: "AIzaSyB78JT_cbPMizvzKWBrQoQUe3-zukHrr1U",
            authDomain: "pharacoin.firebaseapp.com",
            projectId: "pharacoin",
            storageBucket: "pharacoin.firebasestorage.app",
            messagingSenderId: "1047668783635",
            appId: "1:1047668783635:web:10673630ede69c60181de6",
            measurementId: "G-06CG470MPX"  // ✅ تصحيح الخطأ الإملائي
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ========== ثوابت ==========
        const USER_PLAN_KEY = 'binance_user_plan';
        const INVESTMENTS_KEY = 'binance_investments_data';
        const WALLET_KEY = 'binance_wallet_balance';
        let currentUser = null;
        let unsubscribeUser = null;

        // 🎯 الحالات الموحدة
        const STATUS = {
            PENDING: 'pending',
            ACTIVE: 'active',
            COMPLETED: 'completed',
            REJECTED: 'rejected'
        };

        // بيانات الخطط
        const allPlans = {
            starter: { name: 'المبتدئة', amount: 10, daily: 5, total: 50, duration: 10, bg: 'qq.png' },
            bronze: { name: 'البرونزية', amount: 30, daily: 15, total: 150, duration: 10, bg: 'qq.png' },
            silver: { name: 'الفضية', amount: 100, daily: 50, total: 500, duration: 10, bg: 'qq.png' },
            gold: { name: 'الذهبية', amount: 500, daily: 250, total: 2500, duration: 10, bg: 'qw.png' },
            diamond: { name: 'الماسية', amount: 1000, daily: 500, total: 5000, duration: 10, bg: 'qe.png' }
        };

        // ========== دوال مساعدة ==========
        function getWalletBalance() {
            return parseFloat(localStorage.getItem(WALLET_KEY)) || 0;
        }

        // ✅ توحيد حالة الاستثمار (بما فيها approved القديمة)
        function normalizeStatus(status) {
            if (!status) return STATUS.PENDING;
            const s = String(status).toLowerCase().trim();
            if (s === 'approved') return STATUS.COMPLETED; // توافق مع البيانات القديمة
            if (s === 'accepted' || s === 'success') return STATUS.COMPLETED;
            if (s === 'declined' || s === 'failed') return STATUS.REJECTED;
            return s;
        }

        // ✅ إيجاد الاستثمار الأكثر صلة بالخطة (يأخذ الأولوية للحالات النشطة/المعلقة)
        function findRelevantInvestment(investments, planKey) {
            const planInvestments = investments.filter(i => i.planKey === planKey);

            if (planInvestments.length === 0) return null;

            // الأولوية: active > pending > completed > rejected
            const priorityOrder = [
                STATUS.ACTIVE,
                STATUS.PENDING,
                STATUS.COMPLETED,
                STATUS.REJECTED
            ];

            for (const priorityStatus of priorityOrder) {
                const found = planInvestments.find(i => normalizeStatus(i.status) === priorityStatus);
                if (found) return found;
            }

            // إذا لم نجد، نأخذ الأحدث
            return planInvestments.sort((a, b) =>
                new Date(b.createdAt || 0) - new Date(a.createdAt || 0)
            )[0];
        }

        function renderAllPlans(investments) {
            const container = document.getElementById('plansContainer');
            const walletBalance = getWalletBalance();

            container.innerHTML = Object.entries(allPlans).map(([key, plan]) => {
                const relatedInv = findRelevantInvestment(investments, key);
                const state = relatedInv ? normalizeStatus(relatedInv.status) : 'inactive';

                let progress = 0, accumulated = 0, remaining = plan.duration;

                if (relatedInv && state === STATUS.ACTIVE) {
                    const now = new Date();
                    const start = new Date(relatedInv.startDate);
                    const passed = Math.floor((now - start) / (1000 * 60 * 60 * 24));
                    progress = Math.min(100, Math.round((passed / plan.duration) * 100));
                    accumulated = relatedInv.accumulatedProfit || 0;
                    remaining = Math.max(0, plan.duration - passed);
                } else if (relatedInv && state === STATUS.COMPLETED) {
                    progress = 100;
                    accumulated = relatedInv.accumulatedProfit || relatedInv.totalProfit || plan.total;
                    remaining = 0;
                }

                const statusText =
                    state === STATUS.ACTIVE ? '● نشطة' :
                    state === STATUS.PENDING ? '⏳ قيد المراجعة' :
                    state === STATUS.COMPLETED ? '✓ مكتملة' :
                    state === STATUS.REJECTED ? '✗ مرفوضة' :
                    '○ غير نشطة';

                const statusClass =
                    state === STATUS.ACTIVE ? 'active' :
                    state === STATUS.PENDING ? 'pending' :
                    state === STATUS.COMPLETED ? 'completed' :
                    state === STATUS.REJECTED ? 'rejected' : 'inactive';

                const borderColor =
                    state === STATUS.ACTIVE ? 'rgba(74,222,128,0.6)' :
                    state === STATUS.PENDING ? 'rgba(243,186,47,0.6)' :
                    state === STATUS.COMPLETED ? 'rgba(96,165,250,0.6)' :
                    state === STATUS.REJECTED ? 'rgba(239,68,68,0.5)' :
                    'rgba(243,186,47,0.2)';

                // الجزء السفلي من البطاقة حسب الحالة
                let footerHTML = '';

                if (state === STATUS.ACTIVE) {
                    footerHTML = `
                        <div class="detail-row"><span>💰 رصيد المحفظة</span><span class="val">$${walletBalance.toLocaleString('en-US')}</span></div>
                        <div class="detail-row"><span>📊 التقدم</span><span class="val">${progress}%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
                        <div class="detail-row"><span>📅 المتبقي</span><span class="val">${remaining} يوم</span></div>
                        <div class="detail-row"><span>💵 الأرباح المتراكمة</span><span class="val" style="color:#4ade80;">$${accumulated.toLocaleString('en-US')}</span></div>
                        <a href="withdraw.html" class="btn-withdraw">📤 سحب الأرباح</a>
                    `;
                } else if (state === STATUS.PENDING) {
                    footerHTML = `
                        <div class="pending-message">
                            <span class="pulse-dot"></span>
                            ⏳ بانتظار تأكيد الإيداع من الإدارة
                        </div>
                        <div style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:6px;">
                            سيتم تفعيل الباقة تلقائياً بعد المراجعة
                        </div>
                    `;
                } else if (state === STATUS.COMPLETED) {
                    footerHTML = `
                        <div class="completed-message">
                            ✓ تم إكمال الخطة بنجاح
                        </div>
                        <div class="detail-row"><span>💰 رصيد المحفظة</span><span class="val">$${walletBalance.toLocaleString('en-US')}</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
                        <div class="detail-row"><span>💵 الأرباح المحققة</span><span class="val" style="color:#60a5fa;">$${accumulated.toLocaleString('en-US')}</span></div>
                        <div class="btn-completed">✅ الأرباح متاحة في المحفظة</div>
                    `;
                } else if (state === STATUS.REJECTED) {
                    // ✅ حالة الرفض الجديدة
                    footerHTML = `
                        <div class="rejected-message">
                            ✗ تم رفض طلب الإيداع
                        </div>
                        <div style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:6px;">
                            يمكنك المحاولة مرة أخرى بإيداع جديد
                        </div>
                        <a href="deposit.html?plan=${key}" class="btn-activate" style="background: linear-gradient(135deg, #ef4444, #b91c1c); color: white;">🔄 إعادة المحاولة</a>
                    `;
                } else {
                    footerHTML = `
                        <a href="deposit.html?plan=${key}" class="btn-activate">⚡ تفعيل الباقة</a>
                    `;
                }

                return `
                    <div class="plan-card" style="border-color: ${borderColor};">
                        <div class="plan-header">
                            <span class="plan-name">${plan.name}</span>
                            <span class="plan-status ${statusClass}">${statusText}</span>
                        </div>
                        <div class="plan-details">
                            <div class="detail-row"><span>💰 الاستثمار</span><span class="val">$${plan.amount.toLocaleString('en-US')}</span></div>
                            <div class="detail-row"><span>📈 الربح اليومي</span><span class="val">$${plan.daily.toLocaleString('en-US')}</span></div>
                            <div class="detail-row"><span>📅 المدة</span><span class="val">${plan.duration} أيام</span></div>
                            <div class="detail-row"><span>🏆 إجمالي الربح المتوقع</span><span class="val">$${plan.total.toLocaleString('en-US')}</span></div>
                        </div>
                        ${footerHTML}
                    </div>
                `;
            }).join('');
        }

        function updateUserData() {
            if (currentUser) {
                if (unsubscribeUser) unsubscribeUser();
                unsubscribeUser = db.collection('users').doc(currentUser.uid).onSnapshot(doc => {
                    let investments = [];
                    if (doc.exists && doc.data().investments) {
                        investments = doc.data().investments;
                        localStorage.setItem(INVESTMENTS_KEY, JSON.stringify(investments));
                    }
                    if (doc.exists) {
                        const data = doc.data();
                        if (data.fullName) {
                            document.getElementById('sidebarUserName').textContent = data.fullName;
                            document.getElementById('sidebarAvatar').textContent = data.fullName.charAt(0);
                        }
                        if (data.plan) {
                            localStorage.setItem(USER_PLAN_KEY, data.plan);
                        }
                        if (data.balance !== undefined) {
                            localStorage.setItem(WALLET_KEY, data.balance.toString());
                        }
                    }
                    renderAllPlans(investments);
                }, error => {
                    console.log('تعذر الاتصال بـFirestore');
                    renderAllPlans([]);
                });
            } else {
                renderAllPlans([]);
            }
        }

        // ========== مراقبة حالة المستخدم ==========
        auth.onAuthStateChanged(user => {
            currentUser = user;
            updateUserData();
        });

        // ========== Sidebar ==========
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('active'); document.body.style.overflow = 'hidden'; }
        function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('active'); document.body.style.overflow = ''; }
        menuToggle.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
        overlay.addEventListener('click', closeSidebar);
        sidebar.addEventListener('touchstart', (e) => { window.touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        sidebar.addEventListener('touchend', (e) => { if (e.changedTouches[0].screenX - window.touchStartX > 80) closeSidebar(); });

        // ========== تفعيل الرابط النشط تلقائيًا ==========
        const currentPage = window.location.pathname.split('/').pop() || 'dashboard.html';
        document.querySelectorAll('#navMenu a').forEach(link => {
            link.classList.toggle('active', link.getAttribute('href') === currentPage);
        });

        // ========== تهيئة أولية ==========
        renderAllPlans([]);
    </script>
</body>
</html>
